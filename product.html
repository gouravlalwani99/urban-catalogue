<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — Urban Distributor</title>
    <meta name="description" content="View product details from the Urban Distributor catalogue.">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

    <!-- Header -->
    <header class="header" id="header">
        <div class="container header__inner">
            <a href="index.html" class="header__brand">
                <img src="images/logo.png" alt="Urban Distributor" class="header__logo">
            </a>
            <nav class="header__nav" id="mainNav">
                <a href="index.html" class="header__link">Home</a>
                <a href="index.html#products" class="header__link">Products</a>
                <a href="index.html#contact" class="header__link">Contact</a>
            </nav>
            <button class="header__hamburger" id="hamburgerBtn" aria-label="Toggle navigation menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <!-- Mobile nav overlay -->
    <div class="nav-overlay" id="navOverlay"></div>

    <main>
        <section class="detail-section">
            <div class="container">
                <!-- Skeleton Loading -->
                <div id="skeletonLoader" class="detail-skeleton">
                    <div class="detail-skeleton__image"></div>
                    <div class="detail-skeleton__body">
                        <div class="skeleton-line skeleton-line--title" style="width:60%; margin-bottom:24px;"></div>
                        <div class="skeleton-line" style="width:40%;"></div>
                        <div class="skeleton-line" style="width:45%;"></div>
                        <div class="skeleton-line" style="width:35%;"></div>
                        <div class="skeleton-line" style="width:50%;"></div>
                        <div class="skeleton-line skeleton-line--price" style="margin-top:24px;"></div>
                        <div class="skeleton-line skeleton-line--btn" style="width:200px; margin-top:16px;"></div>
                    </div>
                </div>

                <div id="loading" class="loading"></div>
                <div id="product-detail"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->

        <div class="container">
            <div class="footer__grid">
                <div>
                    <img src="images/logo.png" alt="Urban Distributor" class="footer__brand-logo">

                </div>
                <div>
                    <h4 class="footer__heading">Quick Links</h4>
                    <ul class="footer__links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="index.html#products">Products</a></li>
                        <li><a href="#contact">Contact Us</a></li>

                </div>
